name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify README
        run: node scripts/verify-readme.mjs
      - name: Verify Compose files
        run: node scripts/verify-compose.mjs
      - name: Verify observability profile
        run: node scripts/verify-observability.mjs
      - name: Verify backup and restore docs
        run: node scripts/verify-backup.mjs
      - name: Verify M1 exit shape
        run: node scripts/verify-m1-exit.mjs

  # CV-122: Postgres backup/restore round-trip (no server/web build).
  backup-smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres only
        run: docker compose up -d postgres
      - name: Wait for Postgres healthy
        run: |
          set -e
          for i in $(seq 1 36); do
            ps="$(docker compose ps)"
            if echo "$ps" | grep -qE 'postgres .* \(healthy\)'; then
              echo "postgres healthy"
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for postgres"
          docker compose ps
          docker compose logs postgres
          exit 1
      - name: Seed marker and round-trip backup
        run: |
          set -euo pipefail
          chmod +x scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/backup-redis.sh
          docker compose exec -T postgres \
            psql -U corvin -d corvin -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS corvin_backup_smoke (id int PRIMARY KEY, note text NOT NULL);" \
            -c "INSERT INTO corvin_backup_smoke (id, note) VALUES (1, 'cv-122-marker') ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note;"
          DUMP="$(bash scripts/backup-postgres.sh | tail -n 1)"
          test -f "${DUMP}"
          docker compose exec -T postgres pg_restore -l < "${DUMP}" | grep -q corvin_backup_smoke
          docker compose exec -T postgres \
            psql -U corvin -d corvin -v ON_ERROR_STOP=1 \
            -c "DROP TABLE corvin_backup_smoke;"
          bash scripts/restore-postgres.sh "${DUMP}"
          note="$(docker compose exec -T postgres \
            psql -U corvin -d corvin -At -c "SELECT note FROM corvin_backup_smoke WHERE id = 1;")"
          echo "restored note=${note}"
          test "${note}" = "cv-122-marker"
      - name: Optional Redis RDB backup smoke
        run: |
          set -euo pipefail
          docker compose up -d redis
          for i in $(seq 1 36); do
            if docker compose ps | grep -qE 'redis .* \(healthy\)'; then
              echo "redis healthy"
              RDB="$(bash scripts/backup-redis.sh | tail -n 1)"
              test -s "${RDB}"
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for redis"
          docker compose ps
          docker compose logs redis
          exit 1
      - name: Backup logs on failure
        if: failure()
        run: docker compose logs postgres redis
      - name: Tear down
        if: always()
        run: docker compose down -v

  # CV-121: Grafana must load from the optional observability profile (no play stack build).
  observability-smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start observability profile
        # Name only profile services so Compose does not try to build server/web
        # (sibling contexts are absent in this job).
        run: docker compose --profile observability up -d prometheus loki tempo grafana
      - name: Wait for Grafana health
        run: |
          set -e
          for i in $(seq 1 60); do
            body="$(curl -sS --max-time 5 "http://127.0.0.1:3001/api/health" || true)"
            echo "attempt ${i}: ${body}"
            if echo "${body}" | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "grafana loads"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for Grafana"
          docker compose --profile observability ps
          docker compose --profile observability logs prometheus loki tempo grafana
          exit 1
      - name: Curl Prometheus Loki Tempo ready
        run: |
          set -e
          curl -sf "http://127.0.0.1:9090/-/healthy"
          # Loki/Tempo may return 503 briefly while the in-memory ring forms.
          for i in $(seq 1 36); do
            loki_ok=0
            tempo_ok=0
            curl -sf "http://127.0.0.1:3100/ready" >/dev/null && loki_ok=1 || true
            curl -sf "http://127.0.0.1:3200/ready" >/dev/null && tempo_ok=1 || true
            echo "attempt ${i}: loki=${loki_ok} tempo=${tempo_ok}"
            if [ "${loki_ok}" = "1" ] && [ "${tempo_ok}" = "1" ]; then
              echo "loki and tempo ready"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for Loki/Tempo"
          docker compose --profile observability logs loki tempo
          exit 1
      - name: Observability logs on failure
        if: failure()
        run: docker compose --profile observability logs prometheus loki tempo grafana
      - name: Tear down observability
        if: always()
        run: docker compose --profile observability down -v

  # Single Docker job: smoke curls + M1 rated Playwright (avoids two full Rust image builds).
  compose-smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: corvin-chess/server
          path: _server
      - uses: actions/checkout@v4
        with:
          repository: corvin-chess/web
          path: _web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _web/package-lock.json
      - name: Install psql + redis-cli
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
      - name: Install web deps + Playwright
        working-directory: _web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Compose stack
        env:
          SERVER_BUILD_CONTEXT: ./_server
          WEB_BUILD_CONTEXT: ./_web
          CORVIN_RP_ORIGIN: http://localhost:8080
        run: docker compose up --build -d
      - name: Wait for healthy services
        run: |
          set -e
          # Line-based grep: require literal "(healthy)" so "(unhealthy)" cannot pass.
          for i in $(seq 1 90); do
            ps="$(docker compose ps)"
            if echo "$ps" | grep -qE 'postgres .* \(healthy\)' \
              && echo "$ps" | grep -qE 'redis .* \(healthy\)' \
              && echo "$ps" | grep -qE 'server .* \(healthy\)' \
              && echo "$ps" | grep -qE 'web .* \(healthy\)'; then
              echo "all services healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for healthy services"
          docker compose ps
          docker compose logs
          exit 1
      - name: Curl server health and web
        run: |
          set -e
          curl -sf "http://127.0.0.1:3000/health" | grep -q ok
          curl -sf "http://127.0.0.1:8080/" | grep -qi Corvin
          curl -sf "http://127.0.0.1:8080/play" | grep -qi Corvin
      - name: Seed e2e sessions
        env:
          DATABASE_URL: postgres://corvin:corvin_dev_only_change_me@127.0.0.1:5432/corvin
          CORVIN_E2E_SEED: "1"
          CORVIN_ENV: development
        working-directory: _web
        run: node scripts/e2e-seed.mjs
      - name: Playwright rated game on Compose
        working-directory: _web
        env:
          CORVIN_E2E: "1"
          CORVIN_E2E_ORIGIN: http://localhost:8080
          CORVIN_E2E_MANAGED_WEBSERVER: "1"
          DATABASE_URL: postgres://corvin:corvin_dev_only_change_me@127.0.0.1:5432/corvin
          REDIS_URL: redis://127.0.0.1:6379/0
          CI: "true"
        run: npx playwright test e2e/two-browser.spec.ts -g "rated blitz"
      - name: Assert ratings stored
        env:
          DATABASE_URL: postgres://corvin:corvin_dev_only_change_me@127.0.0.1:5432/corvin
        run: node scripts/assert-ratings.mjs
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
