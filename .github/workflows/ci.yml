name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify README
        run: node scripts/verify-readme.mjs
      - name: Verify Compose files
        run: node scripts/verify-compose.mjs

  compose-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose stack
        run: docker compose up --build -d
      - name: Wait for healthy services
        run: |
          set -e
          for i in $(seq 1 60); do
            if docker compose ps | grep -qE 'postgres.*healthy' \
              && docker compose ps | grep -qE 'redis.*healthy' \
              && docker compose ps | grep -qE 'server.*healthy' \
              && docker compose ps | grep -qE 'web.*healthy'; then
              echo "all services healthy"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for healthy services"
          docker compose ps
          docker compose logs
          exit 1
      - name: Curl server health and web stub
        run: |
          set -e
          curl -sf "http://127.0.0.1:3000/health" | grep -q ok
          curl -sf "http://127.0.0.1:8080/" | grep -qi Corvin
      - name: Tear down
        if: always()
        run: docker compose down -v
