# CV-121: load committed Grafana dashboards from /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: corvin
    orgId: 1
    folder: Corvin
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
