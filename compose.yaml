# CV-199: one-command play stack (Postgres, Redis, real server, real web).
# Start from a workspace that contains sibling server/ and web/ checkouts, or set
# SERVER_BUILD_CONTEXT / WEB_BUILD_CONTEXT to those paths:
#   docker compose up --build -d
#
# CV-121 / ADR-015: optional observability profile (Prometheus, Loki, Tempo, Grafana):
#   docker compose --profile observability up -d
# Grafana binds 127.0.0.1:3001 by default (server stays on :3000).

name: corvin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corvin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corvin_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-corvin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corvin} -d ${POSTGRES_DB:-corvin}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ${SERVER_BUILD_CONTEXT:-../server}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-corvin}:${POSTGRES_PASSWORD:-corvin_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-corvin}
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: "3000"
      CORVIN_ENV: ${CORVIN_ENV:-development}
      CORVIN_RP_ID: ${CORVIN_RP_ID:-localhost}
      # Browser origin is the web container (nginx on :8080), not the Axum port.
      CORVIN_RP_ORIGIN: ${CORVIN_RP_ORIGIN:-http://localhost:8080}
      CORVIN_OTP_PEPPER: ${CORVIN_OTP_PEPPER:-corvin_dev_otp_pepper_change_me!!}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ${WEB_BUILD_CONTEXT:-../web}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- observability profile (ADR-015); not started unless --profile observability ---

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    # Distroless image: no wget/curl for a container healthcheck; CI curls host ports.

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    # Distroless image: no wget/curl for a container healthcheck; CI curls host ports.

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-corvin_dev_grafana_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
