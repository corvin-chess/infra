<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corvin</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b0d12;
        --slate: #161b2b;
        --mist: #8fa3d9;
        --gold: #c9a227;
        --paper: #e6e9f2;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #2f3d63 0%, var(--ink) 55%);
        color: var(--paper);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        background: color-mix(in srgb, var(--slate) 92%, transparent);
        border: 1px solid color-mix(in srgb, var(--mist) 35%, transparent);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: var(--mist);
      }
      .gold {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Corvin</h1>
      <p>
        Interim web stub for the Compose stack. The play site arrives when the
        <span class="gold">web</span> repository ships its app image.
      </p>
      <p>Free forever. No ads. No paywall. No trackers.</p>
    </main>
  </body>
</html>
