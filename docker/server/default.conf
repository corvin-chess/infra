server {
  listen 80;
  server_name _;

  location = /health {
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location / {
    default_type text/plain;
    return 404 "corvin server stub: only /health is implemented until the Axum scaffold lands\n";
  }
}
